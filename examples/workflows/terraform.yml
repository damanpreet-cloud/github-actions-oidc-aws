# Copy into .github/workflows/ of the repository the roles trust.
name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/gha-terraform-plan
          aws-region: ca-central-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
      - run: terraform plan -input=false

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production   # approval gate; also changes the token's sub claim
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/gha-terraform-apply
          aws-region: ca-central-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
      - run: terraform apply -input=false -auto-approve
